name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test with race detector
        run: make test-race
      - name: Build packages
        run: make build
      - name: Build native plugin
        run: make c-shared
      - name: Validate registry and release contract tests
        run: go test ./...
      - name: Package current platform
        run: make package-current VERSION=0.1.0
      - name: Generate checksums
        run: make checksums
      - name: Verify release archive and checksums
        run: make verify-release
      - name: Run Docker integration smoke test
        run: make smoke
